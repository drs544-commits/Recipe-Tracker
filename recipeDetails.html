<!--Dyllon task 5: recipe details html-->
<!DOCTYPE html>
<html lang = "eng">
    <head>
        <title>Recipe Details Page</title>
        <!--link the CSS file-->
        <link rel="stylesheet" href="./recipeDetails_styles.css"/>
        <!--linking Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
    </head>
    <body>
        <div id = navbar>
            <nav>
                <a href = "index.html" id = "home-link">Home</a>
            </nav>
        </div>
        <!-- where the image of the food should go-->
        <div id = "image-container"></div>
        <!--where stuff like name, cook-time, and category will go-->
        <div id = "lesser-details"></div>
        <!--more important details seperated into their own containers-->
        <div class = "row bigger_details">   
            <div id = "ingredients" class = "col-sm-6 col-"><h4>Ingredients</h4></div>
            <div id = "instructions" class = "col-sm-6 col-"><h4>Instructions</h4></div>

        </div>
        
        </div>


        <!--dialog-->
        <dialog id="recipeDialog" class="recipe-dialog" aria-labelledby="addRecipeTitle">
            <div class="dialog-layout">
                <button id="closeDialog" class="close-button" type="button" aria-label="Close new recipe form">x</button>
                <form id="createRecipeForm" class="recipe-form">
                <p class="eyebrow">Add to your collection</p>
                <h2 id="addRecipeTitle">New Recipe</h2>
                <label>
                    Recipe name
                    <input name="recipe-name" type="text" required>
                </label>
                <label>
                    Category
                    <input name="category" type="text" required>
                </label>
                <label>
                    Cooking time (minutes)
                    <input name="cooking-time" type="number" min="1" required>
                </label>
                <label>
                    Ingredients <span class="muted">(one per line)</span>
                    <textarea name="ingredients" rows="4" required></textarea>
                </label>
                <label>
                    Instructions <span class="muted">(one step per line)</span>
                    <textarea name="steps" rows="5" required></textarea>
                </label>
                <label>
                    Image
                    <select name="image" required>
                    <option value="" disabled selected>Select an image</option>
                    <option value="files/pasta.jpg">pasta</option>
                    <option value="files/soup.jpg">soup</option>
                    <option value="files/tacos.jpg">tacos</option>
                    </select>
                </label>
                <div class="form-actions">
                    <button class="button primary" type="submit">Add recipe</button>
                </div>
                </form>
            </div>
        </dialog>
        <!--import jquery-->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <!--link the JavaScript file-->
        <script src="./recipeDetails.js"></script>
    </body>
</html>
